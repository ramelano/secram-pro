name: Linux tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ubuntu2404
            image: ubuntu:24.04
          - name: fedora43
            image: fedora:43
          - name: debian13
            image: debian:13
    container:
      image: ${{ matrix.image }}
    steps:
      - name: Install system dependencies
        shell: bash
        run: |
          set -euo pipefail
          . /etc/os-release
          if [[ "$ID" == fedora ]]; then
            dnf -y --setopt=install_weak_deps=False install git python3 python3-pip nmap util-linux iproute mesa-libGL mesa-libEGL libxkbcommon fontconfig dbus-libs glib2 dejavu-sans-fonts
          else
            export DEBIAN_FRONTEND=noninteractive
            apt-get update -qq
            apt-get install -y --no-install-recommends git python3 python3-venv python3-pip nmap util-linux iproute2 libgl1 libegl1 libxkbcommon0 libfontconfig1 libdbus-1-3 libglib2.0-0t64 fonts-dejavu-core
          fi
      - uses: actions/checkout@v4
      - name: Install Python dependencies
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install -r requirements-lock.txt 'setuptools>=69'
          .venv/bin/python -m pip install --no-deps --no-build-isolation -e .
      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: .venv/bin/python -m pytest -q --junitxml=ci-test-results.xml
      - name: Store test result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.name }}
          path: ci-test-results.xml
